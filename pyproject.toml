[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-viewer"
dynamic = ["version"]
description = "Interactive 3D viewer for SAGE semi-analytic galaxy formation outputs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Bradley", email = "mbrads85@live.com.au" }]
requires-python = ">=3.10"
keywords = ["astronomy", "galaxy-formation", "dark-matter", "visualization", "SAGE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pyvista>=0.44",
    "trame>=3.6",
    "trame-vtk>=2.8",
    "trame-vuetify>=2.7",
    "h5py>=3.9",
    "numpy>=1.24",
    "joblib>=1.3",
    "scipy>=1.11",
    # SAGE plotting/analysis stack — so the Console's interpreter can run the
    # SAGE26 plotting scripts and SAGEswarm without extra installs.
    "matplotlib>=3.7",
    "pandas>=2.0",
    # Windows: a real terminal (ConPTY) for the wizard and Console, and a
    # bundled ffmpeg for MOV recording (macOS/Linux use the system one).
    "pywinpty>=2.0; sys_platform == 'win32'",
    "imageio-ffmpeg>=0.4.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "mkdocs-macros-plugin>=1.0",
]
sed = [
    # Synthetic photometry for LightSAGE lightcones (visage/sed/) — kept
    # optional so the base viewer install stays lean.
    "fsps>=0.4",
    "astropy>=5.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.0",
    "pre-commit>=3.6",
    "sage-viewer[docs,sed]",
]

[project.scripts]
visage = "visage.cli:main"

[project.urls]
Homepage = "https://github.com/MBradley1985/ViSAGE"
Documentation = "https://mbradley1985.github.io/ViSAGE/"
Repository = "https://github.com/MBradley1985/ViSAGE"
Issues = "https://github.com/MBradley1985/ViSAGE/issues"

[tool.setuptools.dynamic]
version = { attr = "visage._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["visage*"]

[tool.setuptools.package-data]
# Include nested static assets too (e.g. vendored KaTeX under static/katex/
# and its fonts) — "static/*" alone does not recurse into subdirectories.
# Also bundle the example Story Mode stories so they ship with the package.
visage = ["static/*", "static/**/*", "examples/*.json"]

[tool.ruff]
line-length = 79
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "UP"]
ignore = ["E203", "E266", "E501", "F403", "F401", "E402", "E701", "E401", "E702", "C408"]

[tool.black]
line-length = 79
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: runs a real FSPS SSP-grid build (~15-20s); still runs by default, filter with -m 'not slow' to skip",
]
