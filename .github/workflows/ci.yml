name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linting deps
        run: pip install ruff==0.15.20 black==24.10.0
      - name: ruff
        run: ruff check visage tests
      - name: black
        run: black --check visage tests

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev deps
        if: runner.os == 'Linux'
        run: pip install -e ".[dev]"
      # python-fsps (the optional [sed] extra) needs a Fortran compiler to
      # build, which the macOS/Windows runners lack; its tests skip cleanly.
      - name: Install package and test deps (no FSPS)
        if: runner.os != 'Linux'
        run: pip install -e . pytest pytest-cov
      # OpenGL for headless VTK on every runner (Xvfb on Linux, Mesa on
      # Windows; macOS has it built in).
      - uses: pyvista/setup-headless-display-action@v4
      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=visage --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        with:
          file: coverage.xml
